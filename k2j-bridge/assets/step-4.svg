<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <rect width="1200" height="800" fill="#ffffff"/>
  <g stroke="#1c2030" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- laptop -->
    <g>
      <path d="M640 250 L1020 250 L1000 500 L620 500 Z" rx="16" fill="#1c2030"/>
      <g fill="#ffffff" stroke="none">
        <rect x="672" y="400" width="50" height="60" rx="6"/>
        <rect x="742" y="370" width="50" height="90" rx="6"/>
        <rect x="812" y="335" width="50" height="125" rx="6"/>
        <circle cx="700" cy="360" r="10"/>
        <circle cx="770" cy="330" r="10"/>
        <circle cx="840" cy="298" r="10"/>
        <rect x="700" y="352" width="142" height="10" rx="5" transform="rotate(-24 700 352)"/>
      </g>
      <path d="M620 500 L560 560 L1000 560 L1000 500" fill="#1c2030"/>
      <g stroke-width="8" stroke="#ffffff">
        <line x1="640" y1="520" x2="940" y2="520"/>
        <line x1="628" y1="540" x2="950" y2="540"/>
