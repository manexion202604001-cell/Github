      <!-- body -->
      <path d="M402 660 C355 575 368 450 440 390 C412 370 408 330 432 305 L462 330 C482 320 508 320 528 330 L558 305 C582 330 578 370 550 390 C600 430 620 500 610 560 L600 660 C530 685 450 685 402 660 Z"/>
