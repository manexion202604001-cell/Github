<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>稟議システム | 多段階承認・差し戻し</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="./config.js"></script>
<style>
:root {
  --ink: #1a2333;
  --sub: #66707f;
  --line: #dfe4ec;
  --paper: #f7f8fa;
  --white: #ffffff;
  --accent: #2563eb;
  --accent-soft: #e8effc;
  --danger: #b91c1c;
  --danger-soft: #fdecec;
  --ok: #15803d;
  --ok-soft: #e7f6ec;
  --warn: #b45309;
  --warn-soft: #fdf3e3;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: var(--paper);
  color: var(--ink);
  font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
  font-size: 14px;
  line-height: 1.6;
}
button { font-family: inherit; }
input, select, textarea {
  font-family: inherit; font-size: 14px; color: var(--ink);
  padding: 8px 10px; border: 1px solid var(--line); border-radius: 0;
  background: var(--white);
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
textarea { resize: vertical; }

/* ─── topbar ─── */
.topbar {
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  padding: 12px 24px;
  background: var(--white);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 5;
}
.brand { display: flex; flex-direction: column; cursor: pointer; }
.brand-mark {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: 20px; font-weight: 600; letter-spacing: 0.14em;
}
.brand-sub { font-size: 11px; color: var(--sub); letter-spacing: 0.08em; }
.tabs { display: flex; gap: 4px; }
.tab {
  border: none; background: transparent; padding: 8px 14px;
  font-size: 13px; color: var(--sub); cursor: pointer;
  border-bottom: 2px solid transparent;
}
.tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
.tab:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tab .count {
  display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px;
  background: var(--danger); color: #fff; font-size: 11px; text-align: center;
}
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
.sync-badge { font-size: 11px; color: var(--ok); }
.sync-badge.off { color: var(--sub); }
.user-switch { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); }
.user-switch select { padding: 5px 8px; font-size: 13px; }

/* ─── layout ─── */
.container { max-width: 1080px; margin: 0 auto; padding: 24px; }
.page-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.page-title {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: 20px; font-weight: 600; letter-spacing: 0.06em; margin: 0;
}
.spacer { flex: 1; }

/* ─── buttons ─── */
.btn {
  padding: 8px 14px; border-radius: 0; border: 1px solid var(--line);
  background: var(--white); cursor: pointer; font-size: 13px; white-space: nowrap;
  color: var(--ink);
}
.btn:hover { border-color: var(--sub); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { background: #1d4fc4; }
.btn.danger { background: var(--white); border-color: var(--danger); color: var(--danger); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; }
.btn.warn { background: var(--white); border-color: var(--warn); color: var(--warn); }
.btn.warn:hover { background: var(--warn-soft); }
.btn.ghost { border-style: dashed; color: var(--accent); }
.btn.sm { padding: 4px 9px; font-size: 12px; }

/* ─── card ─── */
.card { background: var(--white); border: 1px solid var(--line); margin-bottom: 16px; }
.card-head {
  padding: 10px 16px; border-bottom: 1px solid var(--line);
  font-size: 13px; font-weight: 600; letter-spacing: 0.04em;
  display: flex; align-items: center; gap: 8px;
}
.card-body { padding: 16px; }

/* ─── filters / list ─── */
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.chip {
  border: 1px solid var(--line); background: var(--white); padding: 5px 12px;
  font-size: 12px; cursor: pointer; color: var(--sub);
}
.chip.active { background: var(--ink); border-color: var(--ink); color: #fff; font-weight: 600; }
.chip .count { font-weight: 600; margin-left: 3px; }
.search-input { width: 220px; }

table.list { width: 100%; border-collapse: collapse; background: var(--white); border: 1px solid var(--line); }
table.list th {
  text-align: left; font-size: 11px; color: var(--sub); font-weight: 600;
  padding: 8px 12px; border-bottom: 1px solid var(--line); background: #fbfcfe;
  letter-spacing: 0.06em; white-space: nowrap;
}
table.list td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.list tr.rowlink { cursor: pointer; }
table.list tr.rowlink:hover { background: var(--accent-soft); }
.doc-title { font-weight: 600; }
.doc-no { font-size: 11px; color: var(--sub); }
.muted { color: var(--sub); font-size: 12px; }
.amount { font-variant-numeric: tabular-nums; white-space: nowrap; }
.empty-note { padding: 32px; text-align: center; color: var(--sub); background: var(--white); border: 1px solid var(--line); }

/* ─── status badge ─── */
.badge {
  display: inline-block; padding: 2px 10px; font-size: 11px; font-weight: 600;
  letter-spacing: 0.06em; border: 1px solid transparent; white-space: nowrap;
}
.st-draft     { background: #eef0f4; color: var(--sub); border-color: var(--line); }
.st-pending   { background: var(--accent-soft); color: var(--accent); border-color: #c4d5f7; }
.st-returned  { background: var(--warn-soft); color: var(--warn); border-color: #f3ddb5; }
.st-approved  { background: var(--ok-soft); color: var(--ok); border-color: #bfe5cc; }
.st-rejected  { background: var(--danger-soft); color: var(--danger); border-color: #f2c5c5; }
.st-withdrawn { background: #eef0f4; color: var(--sub); border-color: var(--line); }

/* ─── detail ─── */
.detail-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.detail-title {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: 22px; font-weight: 600; margin: 0; line-height: 1.4;
}
.meta-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line);
}
.meta-cell { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 8px 12px; }
.meta-label { font-size: 11px; color: var(--sub); letter-spacing: 0.06em; }
.meta-value { font-size: 14px; }
.body-text { white-space: pre-wrap; }

/* ─── stepper ─── */
.stepper { display: flex; flex-wrap: wrap; gap: 0; align-items: stretch; }
.step-box {
  border: 1px solid var(--line); background: var(--white);
  padding: 10px 14px; min-width: 180px; flex: 1; position: relative;
}
.step-box + .step-box { margin-left: -1px; }
.step-box.current { border-color: var(--accent); box-shadow: inset 0 3px 0 var(--accent); z-index: 1; }
.step-box.done { background: var(--ok-soft); }
.step-box.blocked { background: var(--danger-soft); }
.step-no { font-size: 11px; color: var(--sub); letter-spacing: 0.06em; }
.step-name { font-weight: 600; font-size: 13px; }
.step-mode { font-size: 11px; color: var(--sub); }
.approver-line { display: flex; align-items: center; gap: 6px; font-size: 12px; margin-top: 4px; }
.mark { font-size: 12px; width: 16px; text-align: center; flex: none; }
.mark.ok { color: var(--ok); font-weight: 700; }
.mark.ng { color: var(--danger); font-weight: 700; }
.mark.rem { color: var(--warn); font-weight: 700; }
.mark.wait { color: var(--sub); }

/* ─── action panel ─── */
.action-panel { border: 1px solid var(--accent); background: var(--accent-soft); padding: 16px; margin-bottom: 16px; }
.action-panel h3 { margin: 0 0 8px; font-size: 14px; }
.action-panel textarea { width: 100%; }
.action-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
.remand-select { display: flex; align-items: center; gap: 6px; font-size: 12px; }

/* ─── history / comments ─── */
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { padding: 8px 0 8px 16px; border-left: 2px solid var(--line); position: relative; }
.timeline li::before {
  content: ""; position: absolute; left: -5px; top: 14px;
  width: 8px; height: 8px; background: var(--sub);
}
.timeline li.act-approve::before { background: var(--ok); }
.timeline li.act-reject::before { background: var(--danger); }
.timeline li.act-remand::before { background: var(--warn); }
.timeline li.act-submit::before, .timeline li.act-resubmit::before { background: var(--accent); }
.tl-head { font-size: 12px; color: var(--sub); }
.tl-action { font-weight: 600; color: var(--ink); }
.tl-comment { background: #fbfcfe; border: 1px solid var(--line); padding: 6px 10px; margin-top: 4px; font-size: 13px; white-space: pre-wrap; }
.comment-form { display: flex; gap: 8px; margin-top: 10px; }
.comment-form textarea { flex: 1; }

/* ─── forms ─── */
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field.wide { grid-column: 1 / -1; }
.field label { font-size: 12px; color: var(--sub); letter-spacing: 0.04em; }
.field input, .field select, .field textarea { width: 100%; }
.req::after { content: " *"; color: var(--danger); }

/* ─── route editor ─── */
.step-edit { border: 1px solid var(--line); padding: 12px; margin-bottom: 8px; background: #fbfcfe; }
.step-edit-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.step-edit-head .step-no { font-weight: 700; color: var(--ink); }
.approver-checks { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.approver-checks label { display: flex; align-items: center; gap: 5px; font-size: 13px; cursor: pointer; }
.route-tools { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }

/* ─── settings ─── */
.settings-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
table.plain { width: 100%; border-collapse: collapse; }
table.plain th { text-align: left; font-size: 11px; color: var(--sub); padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.plain td { padding: 6px 8px; border-bottom: 1px solid var(--line); font-size: 13px; }
.inline-form { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-top: 10px; }
.inline-form .field { min-width: 140px; }

/* ─── gate screens ─── */
.gate {
  min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
}
.gate-card { background: var(--white); border: 1px solid var(--line); padding: 32px; max-width: 440px; width: 100%; }
.gate-card h1 {
  font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
  font-size: 22px; letter-spacing: 0.12em; margin: 0 0 4px;
}
.gate-card .sub { color: var(--sub); font-size: 12px; margin-bottom: 20px; }
.gate-card .field { margin-bottom: 12px; }
.user-pick { display: flex; flex-direction: column; gap: 6px; }
.user-pick button {
  text-align: left; padding: 10px 14px; border: 1px solid var(--line); background: var(--white);
  cursor: pointer; font-size: 14px;
}
.user-pick button:hover { border-color: var(--accent); background: var(--accent-soft); }
.flash {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: #fff; padding: 10px 20px; font-size: 13px; z-index: 20;
}

@media print {
  .topbar, .action-panel, .no-print, .flash { display: none !important; }
  body { background: #fff; }
  .container { max-width: none; padding: 0; }
  .card { border-color: #999; break-inside: avoid; }
}
@media (max-width: 640px) {
  .container { padding: 12px; }
  .search-input { width: 100%; }
  .stepper { flex-direction: column; }
  .step-box + .step-box { margin-left: 0; margin-top: -1px; }
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ═══════════════════════ 基盤 ═══════════════════════ */

const CONFIG = window.RINGI_CONFIG || {};
const LS_KEY  = "ringi.v1";
const LS_USER = "ringi.currentUser";
const SS_PASS = "ringi.passOk";

const CATEGORIES = ["購買", "経費", "契約", "人事", "システム", "その他"];
const STATUS = {
  draft:     { label: "下書き",   cls: "st-draft" },
  pending:   { label: "承認待ち", cls: "st-pending" },
  returned:  { label: "差し戻し", cls: "st-returned" },
  approved:  { label: "承認済",   cls: "st-approved" },
  rejected:  { label: "却下",     cls: "st-rejected" },
  withdrawn: { label: "取り下げ", cls: "st-withdrawn" },
};
const ACTION_LABEL = {
  create: "作成", submit: "申請", resubmit: "再申請", approve: "承認",
  reject: "却下", remand: "差し戻し", withdraw: "取り下げ", edit: "編集",
};

let state = { members: [], templates: [], docs: [], seq: {} };
let ui = {
  view: "list",          // list | detail | edit | settings
  docId: null,
  editDraft: null,       // 編集中の稟議書(作業コピー)
  tplDraft: null,        // 編集中のテンプレート(作業コピー)
  filter: "inbox",
  q: "", cat: "",
  passOk: !CONFIG.APP_PASSCODE || sessionStorage.getItem(SS_PASS) === "1",
};
let currentUserId = localStorage.getItem(LS_USER) || null;
let sb = null;
let syncOn = false;
let flashTimer = null;

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const now = () => new Date().toISOString();
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
const fmtMoney = (n) => (n == null || n === "" || isNaN(n)) ? "—" : "¥" + Number(n).toLocaleString("ja-JP");
const fmtDate = (iso) => { if (!iso) return "—"; const d = new Date(iso); return isNaN(d) ? "—" : `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; };
const fmtDateTime = (iso) => { if (!iso) return "—"; const d = new Date(iso); return isNaN(d) ? "—" : `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; };

function memberById(id) { return state.members.find((m) => m.id === id) || null; }
function memberName(id) { const m = memberById(id); return m ? m.name : "(不明)"; }
function curUser() { return memberById(currentUserId); }
function isAdmin() {
  const hasAdmin = state.members.some((m) => m.role === "admin" && m.active !== false);
  if (!hasAdmin) return true; // 管理者未設定の間は全員が管理操作可
  const me = curUser();
  return !!me && me.role === "admin";
}
function docById(id) { return state.docs.find((d) => d.id === id) || null; }

/* ─── 永続化(localStorage + Supabase 任意) ─── */

function loadLocal() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) state = Object.assign({ members: [], templates: [], docs: [], seq: {} }, JSON.parse(raw));
  } catch (e) { /* 破損時は初期状態 */ }
}
function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) {} }

async function push(id, data) {
  if (!sb) return;
  try {
    const { error } = await sb.from("ringi_records").upsert({ id, data, updated_at: now() });
    if (error) throw error;
    if (!syncOn) { syncOn = true; render(); }
  } catch (e) { if (syncOn) { syncOn = false; render(); } }
}
async function pushDelete(id) {
  if (!sb) return;
  try { await sb.from("ringi_records").delete().eq("id", id); } catch (e) {}
}
function pushAll() {
  state.members.forEach((m) => push("member:" + m.id, m));
  state.templates.forEach((t) => push("template:" + t.id, t));
  state.docs.forEach((d) => push("doc:" + d.id, d));
  push("meta:seq", state.seq);
}
function applyRemoteRows(rows) {
  const members = [], templates = [], docs = [];
  let seq = {};
  for (const r of rows) {
    if (!r || !r.id || !r.data) continue;
    if (r.id.startsWith("member:")) members.push(r.data);
    else if (r.id.startsWith("template:")) templates.push(r.data);
    else if (r.id.startsWith("doc:")) docs.push(r.data);
    else if (r.id === "meta:seq") seq = r.data || {};
  }
  state = { members, templates, docs, seq };
  saveLocal();
}
function upsertRemoteRecord(id, data) {
  const put = (arr, item) => {
    const i = arr.findIndex((x) => x.id === item.id);
    if (i >= 0) arr[i] = item; else arr.push(item);
  };
  if (id.startsWith("member:")) put(state.members, data);
  else if (id.startsWith("template:")) put(state.templates, data);
  else if (id.startsWith("doc:")) put(state.docs, data);
  else if (id === "meta:seq") state.seq = data || {};
}
function removeRemoteRecord(id) {
  if (id.startsWith("member:")) state.members = state.members.filter((m) => "member:" + m.id !== id);
  else if (id.startsWith("template:")) state.templates = state.templates.filter((t) => "template:" + t.id !== id);
  else if (id.startsWith("doc:")) state.docs = state.docs.filter((d) => "doc:" + d.id !== id);
}
async function sbInit() {
  if (!CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_ANON_KEY || !window.supabase) return;
  try {
    sb = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
    const { data, error } = await sb.from("ringi_records").select("*");
    if (error) throw error;
    if ((!data || data.length === 0) && (state.docs.length || state.members.length)) {
      pushAll(); // 初回:ローカルの既存データをサーバーへ
    } else {
      applyRemoteRows(data || []);
    }
    syncOn = true;
    sb.channel("ringi-sync")
      .on("postgres_changes", { event: "*", schema: "public", table: "ringi_records" }, (payload) => {
        if (payload.eventType === "DELETE" && payload.old && payload.old.id) removeRemoteRecord(payload.old.id);
        else if (payload.new && payload.new.id) upsertRemoteRecord(payload.new.id, payload.new.data);
        saveLocal(); render();
      })
      .subscribe();
  } catch (e) { syncOn = false; }
  render();
}

/* ─── 保存ヘルパー ─── */

function saveMember(m) {
  const i = state.members.findIndex((x) => x.id === m.id);
  if (i >= 0) state.members[i] = m; else state.members.push(m);
  saveLocal(); push("member:" + m.id, m);
}
function saveTemplate(t) {
  const i = state.templates.findIndex((x) => x.id === t.id);
  if (i >= 0) state.templates[i] = t; else state.templates.push(t);
  saveLocal(); push("template:" + t.id, t);
}
function deleteTemplate(id) {
  state.templates = state.templates.filter((t) => t.id !== id);
  saveLocal(); pushDelete("template:" + id);
}
function saveDoc(d) {
  d.updatedAt = now();
  const i = state.docs.findIndex((x) => x.id === d.id);
  if (i >= 0) state.docs[i] = d; else state.docs.push(d);
  saveLocal(); push("doc:" + d.id, d);
}
function deleteDoc(id) {
  state.docs = state.docs.filter((d) => d.id !== id);
  saveLocal(); pushDelete("doc:" + id);
}
function saveSeq() { saveLocal(); push("meta:seq", state.seq); }

/* ═══════════════════════ 業務ロジック ═══════════════════════ */

function newStep() { return { id: uid(), name: "", mode: "all", approverIds: [], decisions: {} }; }
function newDoc() {
  return {
    id: uid(), no: null, title: "", category: CATEGORIES[0], amount: null,
    desiredDate: "", body: "", applicantId: currentUserId,
    status: "draft", currentStep: 0, version: 1,
    steps: [newStep()], history: [], comments: [],
    createdAt: now(), updatedAt: now(), submittedAt: null, decidedAt: null,
  };
}
function log(d, action, comment, detail) {
  d.history.push({ at: now(), userId: currentUserId, action, comment: comment || "", detail: detail || "" });
}
function assignNo(d) {
  if (d.no) return;
  const y = String(new Date().getFullYear());
  state.seq[y] = (state.seq[y] || 0) + 1;
  d.no = "R-" + y + "-" + String(state.seq[y]).padStart(4, "0");
  saveSeq();
}
function stepSatisfied(step) {
  const ok = step.approverIds.filter((id) => step.decisions[id] && step.decisions[id].action === "approve");
  return step.mode === "any" ? ok.length >= 1 : ok.length >= step.approverIds.length;
}
function validateForSubmit(d) {
  const errs = [];
  if (!d.title.trim()) errs.push("件名を入力してください");
  if (!d.body.trim()) errs.push("内容を入力してください");
  if (!d.steps.length) errs.push("承認ルートに最低1段階のステップが必要です");
  d.steps.forEach((s, i) => {
    if (!s.approverIds.length) errs.push(`ステップ${i + 1}に承認者を1名以上指定してください`);
  });
  return errs;
}
function doSubmit(d, isResubmit) {
  d.steps.forEach((s) => { s.decisions = {}; });
  d.status = "pending";
  d.currentStep = 0;
  d.submittedAt = now();
  d.decidedAt = null;
  assignNo(d);
  if (isResubmit) { d.version += 1; log(d, "resubmit", "", `第${d.version}版として再申請`); }
  else log(d, "submit");
  saveDoc(d);
}
function doApprove(d, comment) {
  const s = d.steps[d.currentStep];
  s.decisions[currentUserId] = { action: "approve", at: now(), comment: comment || "" };
  log(d, "approve", comment, `ステップ${d.currentStep + 1}「${s.name || "無題"}」`);
  if (stepSatisfied(s)) {
    if (d.currentStep >= d.steps.length - 1) {
      d.status = "approved"; d.decidedAt = now();
    } else {
      d.currentStep += 1;
    }
  }
  saveDoc(d);
}
function doReject(d, comment) {
  const s = d.steps[d.currentStep];
  s.decisions[currentUserId] = { action: "reject", at: now(), comment };
  d.status = "rejected"; d.decidedAt = now();
  log(d, "reject", comment, `ステップ${d.currentStep + 1}「${s.name || "無題"}」`);
  saveDoc(d);
}
function doRemand(d, target, comment) {
  const s = d.steps[d.currentStep];
  s.decisions[currentUserId] = { action: "remand", at: now(), comment };
  if (target === "applicant") {
    d.status = "returned";
    log(d, "remand", comment, "申請者へ差し戻し(修正・再申請が必要)");
  } else {
    const idx = Number(target);
    log(d, "remand", comment, `ステップ${idx + 1}「${d.steps[idx].name || "無題"}」へ差し戻し`);
    for (let i = idx; i < d.steps.length; i++) d.steps[i].decisions = {};
    d.currentStep = idx;
  }
  saveDoc(d);
}
function doWithdraw(d) {
  d.status = "withdrawn"; d.decidedAt = now();
  log(d, "withdraw");
  saveDoc(d);
}
function needsMyApproval(d) {
  if (d.status !== "pending" || !currentUserId) return false;
  const s = d.steps[d.currentStep];
  if (!s || !s.approverIds.includes(currentUserId)) return false;
  const dec = s.decisions[currentUserId];
  return !(dec && dec.action === "approve");
}
function inboxDocs() { return state.docs.filter(needsMyApproval); }
function suggestTemplate(amount) {
  const a = Number(amount) || 0;
  const hit = state.templates
    .filter((t) => (t.minAmount == null || a >= t.minAmount) && (t.maxAmount == null || a <= t.maxAmount))
    .sort((x, y) => (y.minAmount || 0) - (x.minAmount || 0));
  return hit[0] || null;
}
function applyTemplateToDraft(tpl) {
  ui.editDraft.steps = tpl.steps.map((s) => ({
    id: uid(), name: s.name, mode: s.mode,
    approverIds: s.approverIds.filter((id) => memberById(id)),
    decisions: {},
  }));
}

const app = document.getElementById("app");

function flash(msg) {
  const el = document.createElement("div");
  el.className = "flash"; el.textContent = msg;
  document.querySelectorAll(".flash").forEach((n) => n.remove());
  document.body.appendChild(el);
  clearTimeout(flashTimer);
  flashTimer = setTimeout(() => el.remove(), 2500);
}

function nav(view, docId) {
  ui.view = view;
  ui.docId = docId || null;
  if (view !== "edit") ui.editDraft = null;
  window.scrollTo(0, 0);
  const hash = view === "detail" && docId ? "#doc=" + docId : view === "list" ? "#list" : "#" + view;
  history.replaceState(null, "", hash);
  render();
}

function badge(status) {
  const s = STATUS[status] || { label: status, cls: "" };
  return `<span class="badge ${s.cls}">${esc(s.label)}</span>`;
}

function render() {
  if (!ui.passOk) { app.innerHTML = viewPasscode(); return; }
  if (!state.members.length) { app.innerHTML = viewFirstRun(); return; }
  if (!curUser() || curUser().active === false) { app.innerHTML = viewUserPick(); return; }
  let body = "";
  if (ui.view === "detail") body = viewDetail();
  else if (ui.view === "edit") body = viewEdit();

/* ─── 一覧 ─── */

function filteredDocs() {
  let docs = state.docs.slice();
  if (ui.filter === "inbox") docs = docs.filter(needsMyApproval);
  else if (ui.filter === "mine") docs = docs.filter((d) => d.applicantId === currentUserId);
  else if (ui.filter === "active") docs = docs.filter((d) => d.status === "pending" || d.status === "returned");
  else if (ui.filter === "done") docs = docs.filter((d) => ["approved", "rejected", "withdrawn"].includes(d.status));
  if (ui.cat) docs = docs.filter((d) => d.category === ui.cat);
  if (ui.q.trim()) {
    const q = ui.q.trim().toLowerCase();
    docs = docs.filter((d) =>
      (d.title || "").toLowerCase().includes(q) ||
      (d.no || "").toLowerCase().includes(q) ||
      (d.body || "").toLowerCase().includes(q) ||
      memberName(d.applicantId).toLowerCase().includes(q));
  }
  docs.sort((a, b) => (b.updatedAt || "").localeCompare(a.updatedAt || ""));
  return docs;
}
function routeSummary(d) {
  if (d.status === "pending") {
    const s = d.steps[d.currentStep];
    return `第${d.currentStep + 1}/${d.steps.length}段階 — ${esc(s && s.name || "承認")}(${(s ? s.approverIds : []).map(memberName).map(esc).join("、")})`;

function decisionMark(step, mid) {
  const dec = step.decisions[mid];
  if (!dec) return `<span class="mark wait">─</span>`;
  if (dec.action === "approve") return `<span class="mark ok" title="承認 ${fmtDateTime(dec.at)}">✓</span>`;
  if (dec.action === "reject") return `<span class="mark ng" title="却下 ${fmtDateTime(dec.at)}">✕</span>`;
  return `<span class="mark rem" title="差し戻し ${fmtDateTime(dec.at)}">↩</span>`;
}
function viewStepper(d) {
  return `<div class="stepper">${d.steps.map((s, i) => {
    let cls = "";
    if (d.status === "pending" && i === d.currentStep) cls = "current";
    else if (i < d.currentStep || d.status === "approved") cls = "done";
    else if ((d.status === "rejected" || d.status === "returned") && i === d.currentStep) cls = "blocked";
    const approvers = s.approverIds.map((mid) =>
      `<div class="approver-line">${decisionMark(s, mid)}<span>${esc(memberName(mid))}</span></div>`).join("");
    return `<div class="step-box ${cls}">
      <div class="step-no">STEP ${i + 1}</div>
      <div class="step-name">${esc(s.name || "承認")}</div>
      <div class="step-mode">${s.mode === "any" ? "誰か1名の承認" : "全員の承認"}が必要</div>

  }).join("")}</div>`;
}

      <div class="form-grid">
        <div class="field wide"><label class="req">件名</label>
          <input value="${esc(d.title)}" data-action-input="doc-field" data-field="title" placeholder="例: ノートPC 3台の購入" /></div>
        <div class="field"><label>分類</label>
          <select data-action-change="doc-field" data-field="category">${catOpts}</select></div>
        <div class="field"><label>金額(円)</label>
          <input type="number" min="0" value="${d.amount == null ? "" : esc(d.amount)}" data-action-input="doc-amount" placeholder="例: 450000" /></div>
        <div class="field"><label>希望期日</label>
          <input type="date" value="${esc(d.desiredDate)}" data-action-input="doc-field" data-field="desiredDate" /></div>
        <div class="field wide"><label class="req">内容・理由</label>
          <textarea rows="6" data-action-input="doc-field" data-field="body"
            placeholder="目的・背景、金額の内訳、比較検討の結果などを記載してください。">${esc(d.body)}</textarea></div>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-head">承認ルート(多段階)</div>
    <div class="card-body">
      <div class="route-tools">
        <select id="tpl-select">${tplOpts}</select>
        <button class="btn" data-action="apply-template">適用</button>
        <button class="btn ghost" data-action="auto-route" ${suggested ? "" : "disabled"}
          title="${suggested ? esc(suggested.name) + " が適用されます" : "金額に合致するテンプレートがありません"}">
          金額から自動選択${suggested ? `(→ ${esc(suggested.name)})` : ""}</button>
        <div class="spacer"></div>
        <button class="btn" data-action="step-add">+ ステップ追加</button>
      </div>
      ${renderStepsEditor(d.steps, true)}
      <div class="muted">承認は STEP 1 から順番に進みます。差し戻し時は申請者、または任意の前ステップまで戻せます。</div>
    </div>
  </div>
  <div class="action-row no-print" style="margin-bottom:24px">
    ${d.status === "returned"
      ? `<button class="btn primary" data-action="save-and-resubmit">保存して再申請(第${d.version + 1}版)</button>
         <button class="btn" data-action="save-draft">保存のみ(差し戻し状態のまま)</button>`
      : `<button class="btn primary" data-action="save-and-submit">保存して申請</button>
         <button class="btn" data-action="save-draft">下書き保存</button>`}
    <button class="btn" data-action="cancel-edit">キャンセル</button>
  </div>`;
}

          : `<div class="muted">テンプレートがありません。金額帯ごとの承認ルート(例: 10万円未満は課長のみ、50万円以上は社長まで)を登録しておくと、稟議書作成時に自動適用できます。</div>`}

        </div>
        <div class="action-row">

          <label class="btn" style="display:inline-block">JSONインポート<input type="file" accept="application/json" data-action-change="import-json" style="display:none" /></label>

/* ═══════════════════════ イベント処理 ═══════════════════════ */

function startEdit(doc) {
  ui.editDraft = JSON.parse(JSON.stringify(doc));
  ui.view = "edit";
  window.scrollTo(0, 0);
  render();
}
function persistDraft() {
  const d = ui.editDraft;
  const existing = docById(d.id);
  if (!existing) log(d, "create");
  else log(d, "edit");
  saveDoc(JSON.parse(JSON.stringify(d)));
  return docById(d.id);
}

function handleAction(action, el) {
  const id = el.dataset.id;
  const si = el.dataset.si != null ? Number(el.dataset.si) : null;
  const d = ui.docId ? docById(ui.docId) : null;

  switch (action) {
    /* ゲート */
    case "pass-submit": {
      const v = document.getElementById("pass-input").value;
      if (v === CONFIG.APP_PASSCODE) { ui.passOk = true; sessionStorage.setItem(SS_PASS, "1"); render(); }
      else flash("パスコードが違います");
      break;
    }
    case "firstrun-add": {
      const name = document.getElementById("fr-name").value.trim();
      if (!name) { flash("氏名を入力してください"); break; }
      const m = {
        id: uid(), name,
        dept: document.getElementById("fr-dept").value.trim(),
        title: document.getElementById("fr-title").value.trim(),
        role: document.getElementById("fr-role").value,
        active: true, createdAt: now(),
      };
      saveMember(m);
      currentUserId = m.id; localStorage.setItem(LS_USER, m.id);
      render();
      break;
    }
    case "load-demo": loadDemoData(); render(); flash("サンプルデータを投入しました(操作中: 佐藤 花子)"); break;
    case "pick-user": currentUserId = id; localStorage.setItem(LS_USER, id); render(); break;

    /* ナビゲーション */
    case "nav-list": nav("list"); break;
    case "nav-settings": ui.tplDraft = null; nav("settings"); break;
    case "set-filter": ui.filter = id; render(); break;
    case "open-doc": nav("detail", id); break;
    case "new-doc": ui.docId = null; startEdit(newDoc()); break;

    /* 稟議書 詳細アクション */
    case "edit-doc": if (d) startEdit(d); break;
    case "dup-doc": {
      if (!d) break;
      const c = newDoc();
      Object.assign(c, {
        title: d.title, category: d.category, amount: d.amount, desiredDate: d.desiredDate, body: d.body,
        steps: d.steps.map((s) => ({ id: uid(), name: s.name, mode: s.mode, approverIds: s.approverIds.slice(), decisions: {} })),
      });
      ui.docId = null;
      startEdit(c);
      break;
    }
    case "delete-doc": {
      if (!d) break;
      if (!confirm(`「${d.title || "(無題)"}」を削除します。よろしいですか?`)) break;
      deleteDoc(d.id); nav("list"); flash("削除しました");
      break;
    }
    case "withdraw-doc": {
      if (!d) break;
      if (!confirm("この稟議を取り下げます。よろしいですか?")) break;
      doWithdraw(d); render(); flash("取り下げました");
      break;
    }
    case "submit-doc": {
      if (!d) break;
      const errs = validateForSubmit(d);
      if (errs.length) { alert(errs.join("\n")); break; }
      doSubmit(d, false); render(); flash("申請しました");
      break;
    }

    /* 承認・却下・差し戻し */
    case "approve": {
      if (!d) break;
      const comment = document.getElementById("decision-comment").value.trim();
      doApprove(d, comment); render();
      flash(d.status === "approved" ? "最終承認されました" : "承認しました(次のステップへ)");
      break;
    }
    case "reject": {
      if (!d) break;
      const comment = document.getElementById("decision-comment").value.trim();
      if (!comment) { alert("却下にはコメント(理由)が必須です"); break; }
      if (!confirm("この稟議を却下します。よろしいですか?")) break;
      doReject(d, comment); render(); flash("却下しました");
      break;
    }
    case "remand": {
      if (!d) break;
      const comment = document.getElementById("decision-comment").value.trim();
      if (!comment) { alert("差し戻しにはコメント(理由・修正依頼)が必須です"); break; }
      const target = document.getElementById("remand-target").value;
      doRemand(d, target, comment); render(); flash("差し戻しました");
      break;
    }
    case "add-comment": {
      if (!d) break;
      const ta = document.getElementById("new-comment");
      const text = ta.value.trim();
      if (!text) break;
      d.comments.push({ id: uid(), at: now(), userId: currentUserId, text });
      saveDoc(d); render();
      break;
    }

    /* 編集フォーム */
    case "cancel-edit": ui.editDraft = null; nav(ui.docId ? "detail" : "list", ui.docId); break;
    case "save-draft": {
      const saved = persistDraft();
      ui.editDraft = null; nav("detail", saved.id); flash("保存しました");
      break;
    }
    case "save-and-submit": {
      const errs = validateForSubmit(ui.editDraft);
      if (errs.length) { alert(errs.join("\n")); break; }
      const saved = persistDraft();
      doSubmit(saved, false);
      ui.editDraft = null; nav("detail", saved.id); flash("申請しました");
      break;
    }
    case "save-and-resubmit": {
      const errs = validateForSubmit(ui.editDraft);
      if (errs.length) { alert(errs.join("\n")); break; }
      const saved = persistDraft();
      doSubmit(saved, true);
      ui.editDraft = null; nav("detail", saved.id); flash("再申請しました");
      break;
    }
    case "apply-template": {
      const tid = document.getElementById("tpl-select").value;
      const tpl = state.templates.find((t) => t.id === tid);
      if (!tpl) { flash("テンプレートを選択してください"); break; }
      applyTemplateToDraft(tpl); render();
      break;
    }
    case "auto-route": {
      const tpl = suggestTemplate(ui.editDraft.amount);
      if (!tpl) break;
      applyTemplateToDraft(tpl); render(); flash(`「${tpl.name}」を適用しました`);
      break;
    }
    case "step-add": ui.editDraft.steps.push(newStep()); render(); break;
    case "step-remove": ui.editDraft.steps.splice(si, 1); render(); break;
    case "step-up": {
      const st = ui.editDraft.steps;
      [st[si - 1], st[si]] = [st[si], st[si - 1]]; render();
      break;
    }
    case "step-down": {
      const st = ui.editDraft.steps;
      [st[si + 1], st[si]] = [st[si], st[si + 1]]; render();
      break;
    }

    /* 設定: メンバー */
    case "member-add": {
      const name = document.getElementById("nm-name").value.trim();
      if (!name) { flash("氏名を入力してください"); break; }
      saveMember({
        id: uid(), name,
        dept: document.getElementById("nm-dept").value.trim(),
        title: document.getElementById("nm-title").value.trim(),
        role: document.getElementById("nm-role").value,
        active: true, createdAt: now(),
      });
      render();
      break;
    }
    case "member-toggle": {
      const m = memberById(id);
      if (!m) break;
      m.active = m.active === false;
      saveMember(m); render();
      break;
    }
    case "member-role": {
      const m = memberById(id);
      if (!m) break;
      m.role = m.role === "admin" ? "member" : "admin";
      saveMember(m); render();
      break;
    }

    /* 設定: テンプレート */
    case "tpl-new": ui.tplDraft = { id: uid(), name: "", minAmount: null, maxAmount: null, steps: [newStep()] }; render(); break;
    case "tpl-edit": {
      const t = state.templates.find((x) => x.id === id);
      if (t) { ui.tplDraft = JSON.parse(JSON.stringify(t)); render(); }
      break;
    }
    case "tpl-delete": {
      const t = state.templates.find((x) => x.id === id);
      if (!t) break;
      if (!confirm(`テンプレート「${t.name}」を削除します。よろしいですか?`)) break;
      deleteTemplate(id); render();
      break;
    }
    case "tpl-cancel": ui.tplDraft = null; render(); break;
    case "tpl-save": {
      const t = ui.tplDraft;
      if (!t.name.trim()) { flash("テンプレート名を入力してください"); break; }
      if (!t.steps.length || t.steps.some((s) => !s.approverIds.length)) { alert("各ステップに承認者を1名以上指定してください"); break; }
      saveTemplate(JSON.parse(JSON.stringify(t)));
      ui.tplDraft = null; render(); flash("テンプレートを保存しました");
      break;
    }
    case "tpl-step-add": ui.tplDraft.steps.push(newStep()); render(); break;
    case "tpl-step-remove": ui.tplDraft.steps.splice(si, 1); render(); break;
    case "tpl-step-up": {
      const st = ui.tplDraft.steps;
      [st[si - 1], st[si]] = [st[si], st[si - 1]]; render();
      break;
    }
    case "tpl-step-down": {
      const st = ui.tplDraft.steps;
      [st[si + 1], st[si]] = [st[si], st[si + 1]]; render();
      break;
    }

    /* データ */
    case "export-json": {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "ringi-export-" + new Date().toISOString().slice(0, 10) + ".json";
      a.click(); URL.revokeObjectURL(a.href);
      break;
    }
  }
}

function handleChange(el) {
  const action = el.dataset.actionChange;
  const si = el.dataset.si != null ? Number(el.dataset.si) : null;
  switch (action) {
    case "switch-user": currentUserId = el.value; localStorage.setItem(LS_USER, el.value); render(); break;
    case "set-cat": ui.cat = el.value; render(); break;
    case "doc-field": ui.editDraft[el.dataset.field] = el.value; break;
    case "step-mode": ui.editDraft.steps[si].mode = el.value; break;
    case "step-approver": {
      const s = ui.editDraft.steps[si];
      if (el.checked) { if (!s.approverIds.includes(el.dataset.id)) s.approverIds.push(el.dataset.id); }
      else s.approverIds = s.approverIds.filter((x) => x !== el.dataset.id);
      break;
    }
    case "tpl-step-mode": ui.tplDraft.steps[si].mode = el.value; break;
    case "tpl-step-approver": {
      const s = ui.tplDraft.steps[si];
      if (el.checked) { if (!s.approverIds.includes(el.dataset.id)) s.approverIds.push(el.dataset.id); }
      else s.approverIds = s.approverIds.filter((x) => x !== el.dataset.id);
      break;
    }
    case "import-json": {
      const file = el.files && el.files[0];
      if (!file) break;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (!data || !Array.isArray(data.members) || !Array.isArray(data.docs)) throw new Error("bad");
          if (!confirm("現在のデータをインポート内容で置き換えます。よろしいですか?")) return;
          state = Object.assign({ members: [], templates: [], docs: [], seq: {} }, data);
          saveLocal(); pushAll(); render(); flash("インポートしました");
        } catch (e) { alert("読み込めないファイルです"); }
      };
      reader.readAsText(file);
      break;
    }
  }
}

function handleInput(el) {
  const action = el.dataset.actionInput;
  const si = el.dataset.si != null ? Number(el.dataset.si) : null;
  switch (action) {
    case "set-q": ui.q = el.value; renderListOnly(); break;
    case "doc-field": ui.editDraft[el.dataset.field] = el.value; break;
    case "doc-amount": ui.editDraft.amount = el.value === "" ? null : Number(el.value); break;
    case "step-name": ui.editDraft.steps[si].name = el.value; break;
    case "tpl-field": ui.tplDraft[el.dataset.field] = el.value; break;
    case "tpl-amount": ui.tplDraft[el.dataset.field] = el.value === "" ? null : Number(el.value); break;
    case "tpl-step-name": ui.tplDraft.steps[si].name = el.value; break;
  }
}
/* 検索入力だけはフォーカスを保ったまま一覧を再描画する */
function renderListOnly() {
  const input = document.activeElement;
  const pos = input && input.selectionStart;
  render();
  const again = document.querySelector('[data-action-input="set-q"]');
  if (again) { again.focus(); try { again.setSelectionRange(pos, pos); } catch (e) {} }
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-action]");
  if (el && !el.disabled) handleAction(el.dataset.action, el);
});
document.addEventListener("change", (e) => {
  const el = e.target.closest("[data-action-change]");
  if (el) handleChange(el);
});
document.addEventListener("input", (e) => {
  const el = e.target.closest("[data-action-input]");
  if (el) handleInput(el);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && e.target.id === "pass-input") handleAction("pass-submit", e.target);
});

/* ═══════════════════════ 起動 ═══════════════════════ */

loadLocal();
(function initFromHash() {
  const h = location.hash;
  const m = h.match(/^#doc=(.+)$/);
  if (m && docById(m[1])) { ui.view = "detail"; ui.docId = m[1]; }
  else if (h === "#settings") ui.view = "settings";
})();
render();
sbInit();
</script>
</body>
