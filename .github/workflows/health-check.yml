# 本番の診断エンドポイントを叩き、実際の例外内容を取得する(調査用)
name: Health Check

on:
  push:
    branches: [main]
    paths: ['.github/health-check-trigger']

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch CRON_SECRET from Vercel and call /api/debug/health
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS --fail "https://api.vercel.com/v9/projects?limit=100" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" > /tmp/projects.json
          PROJECT_ID=$(jq -r '[.projects[] | select((.link.repoId|tostring)=="1216588499")][0].id' /tmp/projects.json)
          echo "project: $PROJECT_ID"

          ENV_ID=$(curl -sS --fail "https://api.vercel.com/v9/projects/${PROJECT_ID}/env" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" | jq -r '.envs[] | select(.key=="CRON_SECRET") | .id' | head -1)
          if [ -z "$ENV_ID" ]; then echo "::error::CRON_SECRET が見つかりません"; exit 1; fi
          SECRET=$(curl -sS --fail "https://api.vercel.com/v1/projects/${PROJECT_ID}/env/${ENV_ID}?decrypt=true" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" | jq -r '.value')
          echo "::add-mask::$SECRET"

          echo "=== RECENT DEPLOYMENTS ==="
          curl -sS --fail "https://api.vercel.com/v6/deployments?projectId=${PROJECT_ID}&limit=8&target=production" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" > /tmp/deploys.json
          jq -r '.deployments[] | "\(.state)\t\(.readyState // "-")\t\(.meta.githubCommitSha[0:7] // "-")\t\(.createdAt/1000|todate)\t\(.meta.githubCommitMessage[0:40] // "-")"' /tmp/deploys.json

          echo "=== NEWEST ERROR DEPLOYMENT BUILD LOG ==="
          BAD_ID=$(jq -r '[.deployments[] | select(.state == "ERROR")][0].uid // empty' /tmp/deploys.json)
          if [ -n "$BAD_ID" ]; then
            curl -sS "https://api.vercel.com/v3/deployments/${BAD_ID}/events?builds=1&limit=120" \
              -H "Authorization: Bearer ${VERCEL_TOKEN}" | jq -r '.[] | .payload.text // .text // empty' | tail -80
          else
            echo "(全デプロイREADY)"
          fi

          # デプロイ直後は404のことがあるためリトライ
          for i in $(seq 1 12); do
            status=$(curl -sS -o /tmp/health.json -w "%{http_code}" \
              -H "Authorization: Bearer ${SECRET}" \
              "https://github-ucchau.vercel.app/api/debug/health?image=1&market=1" || echo 000)
            echo "[try $i] HTTP $status"
            if [ "$status" = "200" ]; then break; fi
            sleep 20
          done
          echo "=== HEALTH RESULT ==="
          jq . /tmp/health.json || cat /tmp/health.json
